version: 2

builds:
  - id: dbtool
    main: .
    binary: dbtool
    ldflags:
      - -s -w -X dbtool/cmd.Version={{ .Version }} -X dbtool/cmd.Commit={{ .Commit }} -X dbtool/cmd.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
